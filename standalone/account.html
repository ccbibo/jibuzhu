<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的名字與頭像｜記補住</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/fonts/print-fonts.css"><style>
*{box-sizing:border-box}body{margin:0;background:#D2E6F3;color:#294754;font-family:"Hanken Grotesk","PingFang TC",sans-serif}header{max-width:1100px;margin:auto;padding:25px 35px;display:flex;gap:20px;align-items:center}a{color:inherit;text-decoration:none}.brand{font-size:25px;font-weight:700;letter-spacing:-.05em}main{max-width:700px;margin:35px auto 65px;padding:32px 40px;border:1px solid #91ADBA;border-radius:26px;background:#FFFCF3;box-shadow:4px 6px 0 #AEC8D8}h1{font-size:29px;margin:0 0 12px}p{font-size:14px;line-height:1.9;color:#6B828D}label{font-size:14px;font-weight:500;display:block;margin:20px 0 9px}input{font:inherit;width:100%;padding:12px 15px;font-size:16px;border:1px solid #AFBFC5;border-radius:12px;background:#FFF;color:#294754}input[type=file]{font-size:13px;background:#EFF5F7;border-style:dashed}.preview{display:flex;align-items:center;gap:20px;margin:25px 0}.preview strong{font-size:24px;overflow-wrap:anywhere}.face{display:block;width:64px;height:64px;border-radius:50%;border:2px solid #FFF;background-image:url('/assets/meeting-avatars.png');background-size:500% 200%;background-position:0 0;background-repeat:no-repeat}.preview .face{width:100px;height:100px}.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.choices button{border:2px solid transparent;background:transparent;border-radius:16px;padding:8px;display:grid;place-items:center;cursor:pointer}.choices button[aria-pressed=true]{background:#DFECDD;border-color:#3D775D}.actions{display:flex;justify-content:space-between;align-items:center;gap:20px;border-top:1px solid #D9E3E7;margin-top:20px;padding-top:20px}button.save{border:0;border-radius:13px;background:#295B49;color:#FFFCF1;font-size:16px;padding:14px 23px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.status{min-height:25px;color:#3B725D;font-size:14px}.note{font-size:12px}.error{color:#A33E31}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #2C8D6E;outline-offset:4px}[hidden]{display:none!important}@media(max-width:750px){main{margin:15px 20px;padding:25px}.choices{gap:5px}.face{width:50px;height:50px}}
</style></head><body><header><a class="brand" href="/welcome">● 記補住</a><a href="/speakers">← 回到會議工作台</a></header><main><h1>你的名字，你的樣子。</h1><p>這裡修改的是目前登入帳號的個人資料。會議中的其他人物，可在人物卡上另外編輯；修改外觀不會自動認領發言。</p><div id="preview" class="preview"></div><p id="identity" class="note"></p><form id="profile-form"><label for="name">顯示名稱</label><input id="name" maxlength="80" required autocomplete="nickname"><label>選擇角色頭像</label><div id="choices" class="choices" role="group" aria-label="選擇我的頭像"></div><label for="photo">或上傳自己的圖片</label><input type="file" id="photo" accept="image/png,image/jpeg,image/webp"><p class="note">JPG、PNG、WebP，最多 5 MB。圖片會縮成頭像，與你的本機帳號一起保存；不會傳送給 AI 或 Notion。</p><p id="status" class="status" role="status" aria-live="polite">正在讀取你的資料…</p><div class="actions"><a href="/speakers">取消，返回工作台</a><button class="save" id="save" type="submit" disabled>儲存個人資料</button></div></form></main><script src="/assets/workspace.js"></script><script src="/assets/account.js"></script><script>
'use strict';const $=id=>document.getElementById(id),names=['小新','風間','妮妮','正男','阿呆','小葵','小愛','美冴','廣志','小白'];let currentUser=null,avatar='preset:0',busy=false,saving=false,imageRevision=0;
function face(value){const span=document.createElement('span');span.className='face';span.setAttribute('aria-hidden','true');if(/^preset:[0-9]$/.test(value||'')){const i=Number(value.slice(7));span.style.backgroundPosition=(i%5*25)+'% '+(i<5?0:100)+'%';}else if(/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(value||'')){span.style.backgroundImage='url("'+value+'")';span.style.backgroundSize='cover';span.style.backgroundPosition='center';}return span;}
function render(){const title=document.createElement('strong');title.textContent=$('name').value.trim()||'你的名字';$('preview').replaceChildren(face(avatar),title);for(const b of $('choices').children)b.setAttribute('aria-pressed',String(b.dataset.avatar===avatar));$('save').disabled=busy||!currentUser;$('name').disabled=saving;$('photo').disabled=saving;for(const b of $('choices').children)b.disabled=saving;}$('name').oninput=render;
for(let i=0;i<10;i++){const b=document.createElement('button');b.type='button';b.dataset.avatar='preset:'+i;b.setAttribute('aria-label',names[i]+'頭像');b.append(face(b.dataset.avatar));b.onclick=()=>{if(saving)return;imageRevision++;busy=false;avatar=b.dataset.avatar;$('status').textContent='已選擇'+names[i]+'，儲存後套用。';render();};$('choices').append(b);}
$('photo').onchange=async()=>{if(saving)return;const file=$('photo').files?.[0];if(!file)return;const revision=++imageRevision;busy=true;render();$('status').className='status';$('status').textContent='正在製作頭像縮圖…';let url;try{if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>5*1024*1024)throw Error('請選擇 5 MB 以下的 JPG、PNG 或 WebP。');url=URL.createObjectURL(file);const image=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(Error('圖片無法讀取'));img.src=url;});const canvas=document.createElement('canvas');canvas.width=192;canvas.height=192;const ctx=canvas.getContext('2d');if(!ctx)throw Error('瀏覽器無法製作縮圖');const side=Math.min(image.naturalWidth,image.naturalHeight);ctx.drawImage(image,(image.naturalWidth-side)/2,(image.naturalHeight-side)/2,side,side,0,0,192,192);const encoded=canvas.toDataURL('image/webp',.8);if(encoded.length>100000)throw Error('縮圖仍過大，請換一張圖片。');if(revision!==imageRevision)return;avatar=encoded;$('status').textContent='圖片已讀取，請儲存個人資料。';}catch(error){if(revision===imageRevision){$('status').className='status error';$('status').textContent=error.message;}}finally{if(url)URL.revokeObjectURL(url);if(revision===imageRevision){busy=false;$('photo').value='';render();}}};
$('profile-form').onsubmit=async event=>{event.preventDefault();if(busy||!currentUser||!$('profile-form').reportValidity())return;saving=true;busy=true;render();$('status').className='status';$('status').textContent='正在儲存…';try{const response=await fetch('/api/auth/profile',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value.trim(),avatar})});const result=await response.json();if(!response.ok||!result.user)throw Error(typeof result.error==='string'?result.error:'尚未儲存，請稍後重試。');currentUser=result.user;$('name').value=currentUser.name;avatar=currentUser.avatar||'preset:0';$('status').textContent='已儲存。重新登入後也會保留你的名字與頭像。';}catch(error){$('status').className='status error';$('status').textContent=error.message;}finally{saving=false;busy=false;render();}};
window.JibuzhuAuthReady.then(user=>{if(!user)return;currentUser=user;$('name').value=user.name;avatar=user.avatar||'preset:0';$('identity').textContent=user.email+' · '+(user.role==='admin'?'服務管理員':'一般成員');$('status').textContent='修改完成後，按儲存即可。';render();});
</script></body></html>
