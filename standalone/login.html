<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登入｜記補住</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/fonts/print-fonts.css"><style>
*{box-sizing:border-box}body{margin:0;background:#D2E6F3;color:#294754;font-family:"Hanken Grotesk","PingFang TC",sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit}.shell{display:grid;grid-template-columns:1fr 1fr;min-height:100dvh;max-width:1500px;margin:auto}.story{padding:55px 65px;display:flex;flex-direction:column}.brand{text-decoration:none;font-size:27px;font-weight:700;letter-spacing:-.05em}.story-main{margin:auto 0;padding:55px 0}.story h1{font-size:51px;line-height:1.3;letter-spacing:-.04em;margin:0 0 25px;font-weight:600}.story p{font-size:17px;line-height:1.9;color:#577580;max-width:420px}.people{display:flex;gap:10px;margin:35px 0}.face{width:72px;height:72px;border-radius:50%;background-image:url('/assets/meeting-avatars.png');background-size:500% 200%;border:3px solid #FFFBEF;box-shadow:0 4px 0 #B2CCDC}.face:nth-child(2){background-position:25% 0}.face:nth-child(3){background-position:50% 0}.face:nth-child(4){background-position:75% 0}.story small{font-size:13px;color:#577580}.form-side{padding:60px 55px;display:flex;align-items:center;justify-content:center}.card{background:#FFFCF2;border:1px solid #8CA8B7;border-radius:28px;padding:38px 42px;box-shadow:4px 6px 0 #ACC6D6;width:100%;max-width:500px}.card h2{font-size:29px;margin:0 0 10px}.intro{font-size:14px;line-height:1.8;color:#69808A;margin:0 0 26px}.tabs{display:flex;padding:5px;background:#E8EFF1;border-radius:14px;margin-bottom:25px;gap:5px}.tabs button{border:0;border-radius:10px;background:transparent;color:#5E7680;min-height:42px;flex:1;font-size:15px;cursor:pointer}.tabs button[aria-selected=true]{background:#FFFCF2;color:#254E61;box-shadow:0 2px 5px #516A7A17;font-weight:600}label{display:block;font-size:14px;font-weight:500;margin:18px 0 8px}input{width:100%;font:inherit;font-size:16px;padding:13px 15px;min-height:50px;border:1px solid #B4C3C8;border-radius:12px;background:#FFF;color:#294754}.password{position:relative}.password input{padding-right:70px}.password button{position:absolute;right:8px;top:8px;min-height:34px;border:0;border-radius:8px;background:#EDF3F6;font-size:12px;color:#52717D;padding:5px 10px;cursor:pointer}.hint{font-size:12px;color:#6B818A;line-height:1.8;margin:9px 0}.submit{width:100%;border:0;border-radius:13px;background:#295B49;color:#FFFCF1;min-height:51px;font-size:16px;font-weight:600;margin-top:22px;cursor:pointer}.submit:disabled{opacity:.55;cursor:wait}.feedback{font-size:14px;line-height:1.8;min-height:25px;color:#A23F32;margin:15px 0 0}.back{display:block;text-align:center;margin-top:23px;font-size:13px;color:#5C7B88}.local-note{font-size:12px;line-height:1.8;color:#71858B;border-top:1px solid #DFE7E8;padding-top:18px;margin-top:20px}button,input,a{outline-offset:4px}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #2C8D6E}[hidden]{display:none!important}@media(max-width:1000px){.story{padding:40px}.story h1{font-size:40px}.form-side{padding:40px 25px}.card{padding:30px}}@media(max-width:730px){.shell{grid-template-columns:1fr}.story-main,.story small{display:none}.story{padding:25px}.form-side{padding:0 25px 40px}}
</style></head><body><main class="shell"><section class="story"><a class="brand" href="/welcome">● 記補住</a><div class="story-main"><h1>先認識每個人，<br>再找回每個重點。</h1><p>登入你的工作台，把會議裡的原話、不同觀點與下一步放在一起。</p><div class="people" aria-hidden="true"><span class="face"></span><span class="face"></span><span class="face"></span><span class="face"></span></div><p>一張人物卡，一個清楚的入口。</p></div><small>帳號登入不會自動傳送會議內容或寫入 Notion。</small></section><section class="form-side"><div class="card"><h2 id="title">歡迎回來</h2><p class="intro" id="intro">登入後，開始整理你的會議。</p><p class="hint" id="first-use">第一次使用？請先選「建立帳號」。這裡使用記補住帳號，與 Notion 帳號分開。</p><div class="tabs" role="tablist" aria-label="登入或註冊"><button type="button" id="login-tab" role="tab" aria-selected="true">登入</button><button type="button" id="register-tab" role="tab" aria-selected="false">建立帳號</button></div><form id="auth-form"><div id="name-field" hidden><label for="name">你的名字或暱稱</label><input id="name" maxlength="80" autocomplete="nickname" placeholder="其他人怎麼稱呼你？"></div><label for="email">電子信箱</label><input type="email" id="email" required maxlength="254" autocomplete="username" placeholder="you@example.com"><label for="password">密碼</label><div class="password"><input type="password" id="password" required maxlength="128" autocomplete="current-password"><button type="button" id="show-password" aria-label="顯示密碼">顯示</button></div><p class="hint" id="password-hint">輸入你設定的帳號密碼。</p><button type="submit" id="submit" class="submit">登入工作台 →</button><p id="feedback" class="feedback" role="status" aria-live="polite"></p></form><a class="back" href="/welcome">← 回到產品首頁</a><p class="local-note">這是目前這台服務的本機帳號，尚未提供信箱驗證、忘記密碼與跨裝置同步。首位註冊者可管理 AI 與 Notion 服務設定。</p></div></section></main><script src="/assets/workspace.js"></script><script>
'use strict';const $=id=>document.getElementById(id);let mode='login',submitting=false;function setMode(value){mode=value;$('login-tab').setAttribute('aria-selected',String(mode==='login'));$('register-tab').setAttribute('aria-selected',String(mode==='register'));$('name-field').hidden=mode!=='register';$('name').required=mode==='register';$('title').textContent=mode==='register'?'建立你的工作台':'歡迎回來';$('first-use').hidden=mode==='register';$('intro').textContent=mode==='register'?'先建立帳號，之後可隨時修改名字與頭像。':'登入後，開始整理你的會議。';$('password').minLength=mode==='register'?10:1;$('password').autocomplete=mode==='register'?'new-password':'current-password';$('password-hint').textContent=mode==='register'?'使用 10–128 字元的密碼。':'輸入你設定的帳號密碼。';$('submit').textContent=mode==='register'?'建立帳號並進入 →':'登入工作台 →';$('feedback').textContent='';}function nextPath(){try{const u=new URL(new URLSearchParams(location.search).get('next')||'/speakers',location.origin);return u.origin===location.origin&&['/speakers','/tasks','/settings','/account','/'].includes(u.pathname)?u.pathname+u.search+u.hash:'/speakers';}catch{return '/speakers';}}$('login-tab').onclick=()=>setMode('login');$('register-tab').onclick=()=>setMode('register');$('show-password').onclick=()=>{const show=$('password').type==='password';$('password').type=show?'text':'password';$('show-password').textContent=show?'隱藏':'顯示';$('show-password').setAttribute('aria-label',show?'隱藏密碼':'顯示密碼');};$('auth-form').onsubmit=async event=>{event.preventDefault();if(submitting||!$('auth-form').reportValidity())return;submitting=true;$('submit').disabled=true;$('feedback').textContent=mode==='register'?'正在建立帳號…':'正在登入…';try{const bootstrap=await fetch('/api/session',{credentials:'same-origin',cache:'no-store'});if(!bootstrap.ok)throw Error('無法連線本機服務，請稍後重試。');const response=await fetch('/api/auth/'+(mode==='register'?'register':'login'),{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value,...(mode==='register'?{name:$('name').value.trim()}:{})})});const result=await response.json();if(!response.ok||!result.user)throw Error(typeof result.error==='string'?result.error:'登入未完成，請確認帳號與密碼。');window.JibuzhuWorkspace?.clear();window.JibuzhuWorkspace?.setIdentity?.(result.user.id);$('password').value='';location.assign(nextPath());}catch(error){$('feedback').textContent=error instanceof TypeError?'目前連不到記補住服務，請確認服務已啟動後再試。':error.message||'登入未完成，請稍後重試。';}finally{submitting=false;$('submit').disabled=false;}};setMode(new URLSearchParams(location.search).get('mode')==='register'?'register':'login');
</script></body></html>
